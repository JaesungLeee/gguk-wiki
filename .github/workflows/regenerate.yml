# main에 merge된 뒤 생성 파일(wiki/domains/, index.md, log.md, action-items.md)을 다시 만들어 커밋한다.
# docs/ingest.md의 "main 보호 규칙"을 따른다.
#
# 토큰: secrets WIKI_APP_ID, WIKI_APP_PRIVATE_KEY가 있으면 GitHub App 토큰으로 커밋한다(ruleset 우회용).
# 없으면 기본 GITHUB_TOKEN을 쓴다. ruleset을 걸기 전까지는 기본 토큰으로도 커밋할 수 있다.
# App 토큰 커밋은 이 워크플로를 다시 실행하지만, 결과가 바뀌지 않으면 커밋하지 않으므로 한 번에 멈춘다.
name: 인덱스 재생성

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: regenerate
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    env:
      HAS_APP: ${{ secrets.WIKI_APP_PRIVATE_KEY != '' }}
    steps:
      - name: App 토큰 발급
        id: app-token
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.WIKI_APP_ID }}
          private-key: ${{ secrets.WIKI_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token || github.token }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install -r scripts/requirements.txt

      - name: 생성
        run: python scripts/generate.py

      - name: 생성 파일만 바뀌었는지 확인
        run: |
          unexpected=$(git status --porcelain -- . ':(exclude)wiki/domains' ':(exclude)wiki/index.md' ':(exclude)wiki/log.md' ':(exclude)wiki/action-items.md')
          if [ -n "$unexpected" ]; then
            echo "생성 파일 밖이 바뀌었다:"
            echo "$unexpected"
            exit 1
          fi

      - name: 커밋
        run: |
          git add -A -- wiki/domains wiki/index.md wiki/log.md wiki/action-items.md
          if git diff --cached --quiet; then
            echo "바뀐 내용 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "생성 파일 갱신"
          git push origin HEAD:main
